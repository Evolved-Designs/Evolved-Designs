name: Existing website completion brief
description: Start a public, non-confidential conversation about finishing an existing website.
title: "[Website completion] "
body:
  - type: markdown
    attributes:
      value: |
        Evolved Designs finishes, repairs, tests, and hands off existing websites, stores, portals, and web tools in bounded phases.

        Read [Website Rescue & Completion](https://evolveddesigns.net/website-rescue-completion/) before starting. This issue will be public, so keep project details private through the [private project note](https://evolveddesigns.net/contact-us/?utm_source=github&utm_medium=owned_intake&utm_campaign=existing_website_completion_brief&utm_content=private_note).

        If a short conversation is the useful next step, [book a 30-minute existing-website call](https://calendly.com/evolved-designs/30min?utm_source=github&utm_medium=owned_intake&utm_campaign=existing_website_completion_brief&utm_content=call).

  - type: dropdown
    id: site_type
    attributes:
      label: What is already in progress?
      options:
        - A business website
        - An online store
        - A booking or service website
        - A portal or custom web tool
        - Not sure yet
    validations:
      required: true

  - type: input
    id: public_url
    attributes:
      label: Public site or staging URL
      description: Optional. Share it only when it is safe for anyone to open.
      placeholder: https://example.com

  - type: textarea
    id: must_work
    attributes:
      label: What must work when this phase is done?
      description: Name one visitor, customer, staff, or owner path in plain language.
      placeholder: A visitor should be able to...
    validations:
      required: true

  - type: checkboxes
    id: work_area
    attributes:
      label: Which area is closest to the work?
      options:
        - label: Pages, content, or mobile behavior
        - label: Forms, booking, or customer inquiries
        - label: Ecommerce or payments
        - label: An integration, portal, or automation
        - label: Editing, ownership, or handoff
        - label: Search, accessibility, or launch readiness
        - label: Not sure yet

  - type: textarea
    id: current_state
    attributes:
      label: What is already in place?
      description: Share only non-confidential facts about the current build and work already completed.
      placeholder: The site currently has...
    validations:
      required: true

  - type: dropdown
    id: timing
    attributes:
      label: What timing matters?
      options:
        - A specific launch or decision date
        - Within the next month
        - Within the next quarter
        - Timing is flexible
    validations:
      required: true

  - type: dropdown
    id: next_step
    attributes:
      label: What next step would be useful?
      options:
        - A short call
        - A private follow-up
        - A public answer here
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Public information check
      options:
        - label: I have not included passwords, access links, customer records, private code, or other confidential information.
          required: true

  - type: markdown
    attributes:
      value: |
        Sending this brief does not create a quote, proposal, contract, schedule, or promise of availability. Evolved Designs will confirm fit and scope before proposing work.
