name: Website project conversation
description: Share a non-confidential website goal with Evolved Designs.
title: "[Website project] "
body:
  - type: markdown
    attributes:
      value: |
        Evolved Designs designs, builds, and maintains websites, online stores, and custom web tools. This issue will be public. Use the private project-note link on the issue chooser for private details.

  - type: dropdown
    id: project_type
    attributes:
      label: What are you working on?
      options:
        - A new website
        - An existing website or store
        - Ongoing website care or updates
        - A custom web tool or portal
        - Not sure yet
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: What should the website help people do?
      description: Describe the outcome in plain language.
      placeholder: Visitors should be able to...
    validations:
      required: true

  - type: textarea
    id: current_state
    attributes:
      label: What is already in place?
      description: Share only non-confidential details and public links.
      placeholder: We currently have...
    validations:
      required: true

  - type: dropdown
    id: next_step
    attributes:
      label: What next step would be useful?
      options:
        - A short call
        - A private follow-up
        - A public answer here
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Public information check
      options:
        - label: I have not included passwords, customer records, private access details, or other confidential information.
          required: true
